name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (ex: v0.2.0). Empty = build only'
        required: false
        type: string
      dry-run:
        description: 'Dry run (build + test Codeberg sync, no publish)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Check tag matches Cargo.toml
        if: github.event_name == 'push'
        run: |
          version="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')"
          test "v$version" = "${TAG}"
      - uses: taiki-e/install-action@cross
      - run: cross build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          arch="${{ matrix.target }}"
          arch="${arch%%-*}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/xournal-rpc" dist/
          cp README.md LICENSE dist/
          tar -czf "xournal-rpc-${TAG}-linux-${arch}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: xournal-rpc-*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ !inputs.dry-run && (github.event_name == 'push' || inputs.tag != '') }}
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
      - run: sha256sum xournal-rpc-*.tar.gz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            xournal-rpc-*.tar.gz
            SHA256SUMS.txt

  sync-codeberg:
    needs: publish
    if: ${{ !inputs.dry-run && (github.event_name == 'push' || inputs.tag != '') }}
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
      - run: sha256sum xournal-rpc-*.tar.gz > SHA256SUMS.txt
      - name: Check Codeberg token
        run: |
          if [ -z "${CODEBERG_TOKEN}" ]; then
            echo "::error::Secret CODEBERG_TOKEN is not set. Create one at https://codeberg.org/user/settings/applications and add it as a GitHub secret."
            exit 1
          fi
      - name: Sync release to Codeberg
        run: |
          python3 .github/scripts/sync-codeberg-release.py \
            --tag "${TAG}" \
            --owner luqenov \
            --repo xournalpp-discord-rpc \
            --github-repo "${GITHUB_REPOSITORY}" \
            --files SHA256SUMS.txt xournal-rpc-*.tar.gz

  test-sync-dry-run:
    needs: build
    if: ${{ inputs.dry-run }}
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
      - run: sha256sum xournal-rpc-*.tar.gz > SHA256SUMS.txt
      - name: Dry-run Codeberg sync
        run: |
          python3 .github/scripts/sync-codeberg-release.py \
            --tag "${TAG}" \
            --owner luqenov \
            --repo xournalpp-discord-rpc \
            --github-repo "${GITHUB_REPOSITORY}" \
            --files SHA256SUMS.txt xournal-rpc-*.tar.gz \
            --dry-run
